name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Don't include real financial data, account numbers, tokens or keys.** Security issues go to private reporting instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to …\n2. Click …\n3. See …"
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit (Settings page footer, or `docker compose images`).
  - type: dropdown
    id: deploy
    attributes:
      label: How do you run it?
      options:
        [Docker Compose + Tailscale, Docker Compose + Cloudflare, Development (pnpm dev), Other]
  - type: dropdown
    id: provider
    attributes:
      label: Bank data provider (if relevant)
      options: ["N/A", SimpleFIN, Plaid, Teller, File import]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs web worker` around the time of the problem. Logs redact secrets and amounts, but please double-check."
      render: shell
