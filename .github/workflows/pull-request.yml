name: Pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    name: Sign-off (DCO)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Every commit in the pull request (merge commits aside) needs a Signed-off-by line for its
      # author's email address. See CONTRIBUTING.md → Commits and sign-off.
      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git show -s --format='%ae' "$c" | tr '[:upper:]' '[:lower:]')
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$c" \
                | tr '[:upper:]' '[:lower:]' | grep -qF "<$email>"; then
              echo "::error::$(git show -s --format='%h %s' "$c") has no 'Signed-off-by:' for its author <$email>"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Sign off with 'git commit --amend -s --no-edit' (last commit) or 'git rebase --signoff $BASE' (all), then force-push."
          fi
          exit $bad

  dependency-review:
    name: Dependency review
    # Needs GitHub's dependency graph, which private repositories only have with Advanced Security.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # summary comment
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
